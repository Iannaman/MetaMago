name: Windows tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Integration tests
        shell: powershell
        run: .\Test-OfficeMetadata.ps1
      - name: Build portable archive
        shell: powershell
        run: .\Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MetaMago-portable
          path: dist/*

  office-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated HTML and build web preview
        run: node Office/build.mjs --check --pages
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test smoke
        run: node Office/tests/smoke.mjs
      - name: Test mark
        run: node Office/tests/mark.mjs
      - name: Test web
        run: node Office/tests/web.mjs
      - name: Test team
        run: node Office/tests/team.mjs
      - name: Test global
        run: node Office/tests/global.mjs
      - name: Test quality
        run: node Office/tests/quality.mjs
      - name: Test experience
        run: node Office/tests/experience.mjs
      - name: Test inspector
        run: node Office/tests/inspector.mjs
      - name: Test automation
        run: node Office/tests/automation.mjs
