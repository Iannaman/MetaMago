name: Windows tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Integration tests
        shell: powershell
        run: .\Test-OfficeMetadata.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Office HTML
        run: |
          npm ci --prefix Office/pdf-deps --ignore-scripts --no-audit --no-fund
          npm view @arshad-shah/qpdf-wasm@0.1.0 dist.integrity
          node Office/build.mjs
      - name: Build portable archive
        shell: powershell
        run: .\Build-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MetaMago-portable
          path: dist/*

  office-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify generated HTML and build web preview
        run: |
          npm ci --prefix Office/pdf-deps --ignore-scripts --no-audit --no-fund
          npm view @arshad-shah/qpdf-wasm@0.1.0 dist.integrity
          node Office/build.mjs
          node Office/build.mjs --check --pages
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test smoke
        run: node Office/tests/smoke.mjs
      - name: Test mark
        run: node Office/tests/mark.mjs
      - name: Test web
        run: node Office/tests/web.mjs
      - name: Test team
        run: node Office/tests/team.mjs
      - name: Test global
        run: node Office/tests/global.mjs
      - name: Test quality
        run: node Office/tests/quality.mjs
      - name: Test experience
        run: node Office/tests/experience.mjs
      - name: Test inspector
        run: node Office/tests/inspector.mjs
      - name: Test automation
        run: node Office/tests/automation.mjs
      - name: Test audit
        run: node Office/tests/audit.mjs
      - name: Test performance and benchmark
        run: node Office/tests/performance.mjs
      - name: Test professional
        run: node Office/tests/professional.mjs
      - name: Test PWA updates
        run: node Office/tests/update.mjs
      - name: Install PDF renderer
        run: command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Test PDF metadata and rendering
        run: node Office/tests/pdf.mjs
      - name: Install independent PDF verifier
        run: command -v qpdf || (sudo apt-get update && sudo apt-get install -y qpdf)
      - name: Test PDF protection
        run: node Office/tests/protection.mjs
      - name: Test PDF Inspector
        run: node Office/tests/pdf-inspector.mjs
      - name: Test PDF Publication
        run: node Office/tests/publication.mjs
      - name: Test PDF Batch
        run: node Office/tests/pdf-batch.mjs
      - name: Test Office Privacy
        run: node Office/tests/privacy.mjs
      - name: Test Compliance
        run: node Office/tests/compliance.mjs
      - name: Test Workflow
        run: node Office/tests/workflow.mjs
      - name: Test Optimization
        run: node Office/tests/optimization.mjs
      - name: Test Unified
        run: node Office/tests/unified.mjs
      - name: Test Stability
        run: node Office/tests/stability.mjs
      - name: Test PDF fallback
        run: node Office/tests/pdf-fallback.mjs

  browser-compatibility:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build application
        run: |
          npm ci --prefix Office/pdf-deps --ignore-scripts --no-audit --no-fund
          node Office/build.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Compatibility tests
        env:
          METAMAGO_BROWSER: ${{ matrix.browser }}
        run: node Office/tests/compatibility.mjs
