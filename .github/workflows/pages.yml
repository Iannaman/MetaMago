name: Deploy MetaMago Web
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metamago-pages
  cancel-in-progress: false
jobs:
  build-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build only the public web files
        run: |
          npm ci --prefix Office/pdf-deps --ignore-scripts --no-audit --no-fund
          npm view @arshad-shah/qpdf-wasm@0.1.0 dist.integrity
          node Office/build.mjs
          node Office/build.mjs --check --pages
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test smoke
        run: node Office/tests/smoke.mjs
      - name: Test mark
        run: node Office/tests/mark.mjs
      - name: Test web
        run: node Office/tests/web.mjs
      - name: Test team
        run: node Office/tests/team.mjs
      - name: Test global
        run: node Office/tests/global.mjs
      - name: Test quality
        run: node Office/tests/quality.mjs
      - name: Test experience
        run: node Office/tests/experience.mjs
      - name: Test inspector
        run: node Office/tests/inspector.mjs
      - name: Test automation
        run: node Office/tests/automation.mjs
      - name: Test audit
        run: node Office/tests/audit.mjs
      - name: Test performance and benchmark
        run: node Office/tests/performance.mjs
      - name: Test professional
        run: node Office/tests/professional.mjs
      - name: Test PWA updates
        run: node Office/tests/update.mjs
      - name: Install PDF renderer
        run: command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Test PDF metadata and rendering
        run: node Office/tests/pdf.mjs
      - name: Install independent PDF verifier
        run: command -v qpdf || (sudo apt-get update && sudo apt-get install -y qpdf)
      - name: Test PDF protection
        run: node Office/tests/protection.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish tested website
        id: deployment
        uses: actions/deploy-pages@v4
